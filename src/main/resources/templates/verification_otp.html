<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification OTP - ECOBANK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1A2B6B">
    <style>
        body {
            background-color: #f5f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-otp {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
<div class="card card-otp p-4">
    <div class="text-center mb-4">
        <img src="/logo_ecobank.png" alt="Ecobank" style="height: 60px;">
        <h4 class="mt-3" style="font-weight: 500;">Vérification du code</h4>
        <p class="text-muted small">Un code de vérification a été envoyé à votre adresse email. Veuillez le saisir ci-dessous.</p>
    </div>

    <div th:if="${erreur}" class="alert alert-danger text-center small">
        <i class="bi bi-exclamation-circle"></i> <span th:text="${erreur}"></span>
    </div>

    <form method="POST" action="/verification-otp">
        <div class="mb-3">
            <label class="form-label text-muted small">Code de vérification</label>
            <input type="text" name="code" class="form-control text-center" placeholder="Entrez le otp" maxlength="6" required style="font-size: 24px; letter-spacing: 8px;">
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2" style="background-color: #2563EB; border: none; height: 42px;">
            Vérifier
        </button>
    </form>

    <p class="text-muted text-center small mt-3 mb-0">Le code expire dans 5 minutes</p>
</div>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js');
    }
</script>
</body>
</html>
