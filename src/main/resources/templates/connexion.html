<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1A2B6B">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - ECOBANK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-connexion {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
<div class="card card-connexion p-4">
    <div class="text-center mb-4">
        <img src="/logo_ecobank.png" alt="Ecobank" style="height: 60px;">
        <h4 class="mt-3" style="font-weight: 500;">Gestion des stagiaires</h4>
        <p class="text-muted small">Connectez-vous pour accéder à l'application</p>
    </div>

    <div th:if="${erreur}" class="alert alert-danger text-center small">
        <i class="bi bi-exclamation-circle"></i> <span th:text="${erreur}"></span>
    </div>

    <form method="POST" action="/connexion">
        <div class="mb-3">
            <label class="form-label text-muted small">Identifiant</label>
            <input type="text" name="identifiant" class="form-control" placeholder="Entrez votre identifiant" required>
        </div>
        <div class="mb-3">
            <label class="form-label text-muted small">Mot de passe</label>
            <input type="password" name="motDePasse" class="form-control" placeholder="Entrez votre mot de passe" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2" style="background-color: #2563EB; border: none; height: 42px;">
            Se connecter
        </button>
    </form>

    <p class="text-muted text-center small mt-4 mb-0">Accès réservé aux utilisateurs autorisés</p>
</div>
</body>
</html>
